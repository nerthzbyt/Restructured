name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_NO_INPUT: "1"
        run: |
          python -m pip install -r requirements.lock

      - name: Syntax check
        run: |
          python -m compileall -q scripts NerT_AI_PRO nertz_engine src_dev src

      - name: Config registry sanity (.env.example up to date)
        run: |
          python src/settings.py --env-example > /tmp/env.generated
          diff <(grep -v '^#' /tmp/env.generated | grep .) <(sed -n '/^# ===== exchange/,$p' .env.example | grep -v '^#' | grep .)

      - name: Unit + offline integration tests
        run: |
          python -m unittest tests.test_signal_engine tests.test_dev_signal_lab tests.test_system tests.test_core_units tests.test_engine_offline tests.test_combined_parity -v

      - name: Security helper smoke tests
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'scripts')
          from path_safety import safe_path_under_project, safe_write_text
          from url_safety import safe_local_base_url
          safe_path_under_project('logs/results.json')
          safe_local_base_url('http://127.0.0.1:8787')
          print('security helpers ok')
          "
